name: Security branch tests

on:
  push:
    branches:
      - security/remove-plaintext-passwords
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/etude_test
      - run: npx prisma generate
      - run: npm test -- --runInBand
      - run: npm run build

  frontend:
    name: Frontend lint, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - run: npm ci
      # Existing repository-wide React lint findings are tracked separately.
      # Keep the complete report visible without masking type/build failures.
      - name: Full frontend lint (legacy baseline, non-blocking)
        run: npm run lint
        continue-on-error: true
      - name: Lint security-change frontend files
        run: npx eslint src/components/admin/AdminUserDetailPage.tsx src/lib/api/admin-client.ts
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
