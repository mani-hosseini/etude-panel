services:
  postgres:
    image: postgres:16-alpine
    container_name: etude-panel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: etude
      POSTGRES_PASSWORD: etude
      POSTGRES_DB: etude_panel
    ports:
      - "5432:5432"
    volumes:
      - etude_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etude -d etude_panel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  etude_pg_data:
